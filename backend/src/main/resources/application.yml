spring:
  application:
    name: corporate-learning-tracker
  config:
  # External config (overrides classpath defaults). Set CORP_CONFIG_HOME to change location.
    additional-location: >-
      optional:file:${CORP_CONFIG_HOME:C:/Users/Administrator/propeller-architect-main}/config/,
      optional:file:${CORP_CONFIG_HOME:C:/Users/Administrator/propeller-architect-main}/backend/src/main/resources/
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

corp-learning:
  ingest-api-key: ${INGEST_API_KEY:demo-ingest-key}
  default-role: ${DEFAULT_USER_ROLE:LND_ADMIN}

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:corplearning;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:corplearning}
    username: ${DB_USER:corpuser}
    password: ${DB_PASSWORD:corppass}
    driver-class-name: org.postgresql.Driver
