services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corplearning
      POSTGRES_USER: corpuser
      POSTGRES_PASSWORD: corppass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpuser -d corplearning"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: corplearning
      DB_USER: corpuser
      DB_PASSWORD: corppass
      INGEST_API_KEY: demo-ingest-key
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
